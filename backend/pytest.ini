[pytest]
# Iter 292 (QA Meta-Layer, Part B) — flaky-test quarantine convention.
#
# Rule: any test that fails, then passes on an identical re-run with
# no code change, gets `@pytest.mark.flaky` and moves to a
# non-blocking suite. Still runs, still visible, but does NOT block
# a merge/deploy by itself.
#
# Ownership rule (from AGENTS.md): every @flaky test carries an
# `owner=<agent-name>` and `fix_by=<iter-number>` metadata via the
# `pytest.mark.flaky(reason="...", owner="...", fix_by=...)` args.
# A flaky test with no owner is a bug in the process, not a
# tolerated state.
#
# Quarantine ceiling: >5-10% of the suite tagged @flaky signals
# systemic async/timing issues. Treated as a priority item, not
# routine maintenance.

markers =
    flaky: quarantined intermittent test — non-blocking. Requires owner + fix_by.
    slow: test takes > 3 seconds; excluded from CI fast lane.
    integration: needs live external services (skip on smoke).
    llm_judge: uses live LLM-as-judge (real Emergent LLM key call, costs $$). Excluded from PR CI; run weekly via cron or on-demand.
    legacy: deliberately deferred pre-existing failure (iter36-iter267 era). Founder ruling 2026-07-29 - quarantined, NOT fixed, NOT deleted. Tracked in tests/legacy_quarantine.txt + .emergent/legacy-test-report.md. Non-blocking legacy lane in ci.yml runs them separately.

# Default run: exclude @flaky, @llm_judge AND @legacy so the CI
# blocking-lane stays green + free. The legacy lane runs explicitly
# with `pytest -m legacy` (non-blocking ci.yml step).
addopts = -m "not flaky and not llm_judge and not legacy"

asyncio_mode = auto
