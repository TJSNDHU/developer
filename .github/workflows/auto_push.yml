name: Force sync preview to main

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # Iter 306 — hoist secret to job-level env so step-level `if:`
      # can gate on `env.API_KEY != ''` (secrets context is disallowed
      # inside step-level `if:`).
      API_KEY: ${{ secrets.AUREM_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify build
        run: |
          echo "Build verified at $(date)"
          echo "Commit: ${{ github.sha }}"

      - name: Deploy notification
        if: env.API_KEY != ''
        run: |
          curl -s -X POST \
            "https://auremcto.com/api/aurem-dev/github-deploy/report" \
            -H "Content-Type: application/json" \
            -d "{\"api_key\":\"$API_KEY\",\"commit\":\"${{ github.sha }}\",\"status\":\"success\",\"repo\":\"${{ github.repository }}\"}" \
            || echo "notify done"
