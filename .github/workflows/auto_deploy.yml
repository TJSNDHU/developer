name: AUREM Auto-Deploy
# ─────────────────────────────────────────────────────────────────────
# Installed by AUREM's GitHub deploy service. Validates an AUREM PR
# (labeled `aurem-autofix`), then on merge into the default branch
# triggers the customer's existing deploy webhook and reports the
# outcome back to the AUREM dashboard.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   • AUREM_DEPLOY_HOOK_URL  — your deploy provider webhook URL
#   • AUREM_API_KEY          — your AUREM customer API key
#   • AUREM_DEPLOY_TARGET    — vercel | render | fly | hetzner | custom
#   • AUREM_NOTIFY_EMAIL     — recipient for deploy notifications (optional)
#
# Required repo variables (Settings → Variables):
#   • AUREM_REPORT_URL       — https://auremcto.com/api/aurem-dev/github-deploy/report
# ─────────────────────────────────────────────────────────────────────

on:
  pull_request:
    types: [labeled, opened, synchronize]
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: aurem-auto-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-aurem-pr:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'aurem-autofix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify PR opened by AUREM
        run: |
          if [ "${{ github.event.pull_request.user.login }}" != "aurem-bot" ] && \
             [[ "${{ github.event.pull_request.title }}" != "[AUREM]"* ]]; then
            echo "::error::PR is labeled aurem-autofix but not opened by AUREM"
            exit 1
          fi
          echo "AUREM PR validated."

  deploy-and-report:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger customer deploy webhook
        id: trigger
        if: ${{ secrets.AUREM_DEPLOY_HOOK_URL != '' }}
        env:
          HOOK: ${{ secrets.AUREM_DEPLOY_HOOK_URL }}
        run: |
          set +e
          HTTP=$(curl -s -o /tmp/deploy_resp.txt -w "%{http_code}" \
                      -X POST "$HOOK" \
                      -H "Content-Type: application/json" \
                      -d "{\"commit\":\"${{ github.sha }}\",\"ref\":\"${{ github.ref }}\"}")
          echo "deploy_status=$HTTP" >> $GITHUB_OUTPUT
          if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]; then
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "result=failure" >> $GITHUB_OUTPUT
            cat /tmp/deploy_resp.txt
          fi
      - name: Report to AUREM
        if: ${{ secrets.AUREM_API_KEY != '' }}
        env:
          API_KEY:    ${{ secrets.AUREM_API_KEY }}
          REPORT_URL: ${{ vars.AUREM_REPORT_URL }}
          RESULT:     ${{ steps.trigger.outputs.result || 'success' }}
          REPO:       ${{ github.repository }}
          COMMIT:     ${{ github.sha }}
        run: |
          URL="${REPORT_URL:-https://auremcto.com/api/aurem-dev/github-deploy/report}"
          curl -s -X POST "$URL" \
               -H "Content-Type: application/json" \
               -d "{\"api_key\":\"$API_KEY\",\"commit\":\"$COMMIT\",\"status\":\"$RESULT\",\"repo\":\"$REPO\"}" \
               || echo "Report to AUREM failed (non-fatal)"
