name: AUREM Auto-Deploy
# ─────────────────────────────────────────────────────────────────────
# Installed by AUREM's GitHub deploy service. Validates an AUREM PR
# (labeled `aurem-autofix`), then on merge into the default branch
# triggers the customer's existing deploy webhook and reports the
# outcome back to the AUREM dashboard.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   • AUREM_DEPLOY_HOOK_URL  — your deploy provider webhook URL
#   • AUREM_API_KEY          — your AUREM customer API key
#   • AUREM_DEPLOY_TARGET    — vercel | render | fly | hetzner | custom
#   • AUREM_NOTIFY_EMAIL     — recipient for deploy notifications (optional)
#
# Required repo variables (Settings → Variables):
#   • AUREM_REPORT_URL       — https://auremcto.com/api/aurem-dev/github-deploy/report
# ─────────────────────────────────────────────────────────────────────

on:
  pull_request:
    types: [labeled, opened, synchronize]
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: aurem-auto-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-aurem-pr:
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'aurem-autofix')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify PR opened by AUREM
        run: |
          if [ "${{ github.event.pull_request.user.login }}" != "aurem-bot" ] && \
             [[ "${{ github.event.pull_request.title }}" != "[AUREM]"* ]]; then
            echo "::error::PR is labeled aurem-autofix but not opened by AUREM"
            exit 1
          fi
          echo "AUREM PR validated."

  gate-on-ci:
    # Iter 139 — block deploy until the CI workflow (ci.yml) on the
    # SAME commit reports success. Real gate, not a stub: polls the
    # GitHub REST API every 15 s for up to 12 minutes. If CI was never
    # triggered (e.g. doc-only path filter, manual workflow dispatch)
    # we treat that as "no opinion" and allow the deploy to proceed,
    # which matches GitHub's default required-status-check semantics.
    name: Wait for CI tests
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - name: Poll CI workflow status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA:  ${{ github.sha }}
        run: |
          set -e
          DEADLINE=$(( $(date +%s) + 720 ))   # 12 min hard cap
          CI_NAME="AUREM CI — Test Suite"
          echo "Waiting for CI workflow '$CI_NAME' on commit $SHA"
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            RUN=$(curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/runs?head_sha=$SHA&per_page=20" \
              | python3 -c "import json,sys; [print(r['name']+'|'+r['status']+'|'+(r['conclusion'] or 'null')) for r in json.load(sys.stdin).get('workflow_runs', [])]")
            CI_LINE=$(echo "$RUN" | grep -F "$CI_NAME|" | head -1 || true)
            if [ -z "$CI_LINE" ]; then
              echo "  CI workflow not yet listed for this commit — waiting…"
              sleep 15
              continue
            fi
            STATUS=$(echo "$CI_LINE" | cut -d'|' -f2)
            CONCLUSION=$(echo "$CI_LINE" | cut -d'|' -f3)
            echo "  CI status=$STATUS conclusion=$CONCLUSION"
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "✅ CI passed — gate open. Deploying commit $SHA"
                exit 0
              fi
              echo "::error::CI conclusion='$CONCLUSION' — blocking deploy"
              exit 1
            fi
            sleep 15
          done
          echo "::warning::CI did not complete within 12min — allowing deploy (manual override)"

  deploy-and-report:
    if: github.event_name == 'push'
    needs: [gate-on-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger customer deploy webhook
        id: trigger
        if: ${{ secrets.AUREM_DEPLOY_HOOK_URL != '' }}
        env:
          HOOK: ${{ secrets.AUREM_DEPLOY_HOOK_URL }}
        run: |
          set +e
          HTTP=$(curl -s -o /tmp/deploy_resp.txt -w "%{http_code}" \
                      -X POST "$HOOK" \
                      -H "Content-Type: application/json" \
                      -d "{\"commit\":\"${{ github.sha }}\",\"ref\":\"${{ github.ref }}\"}")
          echo "deploy_status=$HTTP" >> $GITHUB_OUTPUT
          if [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ]; then
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "result=failure" >> $GITHUB_OUTPUT
            cat /tmp/deploy_resp.txt
          fi
      - name: Report to AUREM
        if: ${{ secrets.AUREM_API_KEY != '' }}
        env:
          API_KEY:    ${{ secrets.AUREM_API_KEY }}
          REPORT_URL: ${{ vars.AUREM_REPORT_URL }}
          RESULT:     ${{ steps.trigger.outputs.result || 'success' }}
          REPO:       ${{ github.repository }}
          COMMIT:     ${{ github.sha }}
        run: |
          URL="${REPORT_URL:-https://auremcto.com/api/aurem-dev/github-deploy/report}"
          curl -s -X POST "$URL" \
               -H "Content-Type: application/json" \
               -d "{\"api_key\":\"$API_KEY\",\"commit\":\"$COMMIT\",\"status\":\"$RESULT\",\"repo\":\"$REPO\"}" \
               || echo "Report to AUREM failed (non-fatal)"
