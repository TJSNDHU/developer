name: Quality Gate — Bug-fix Discipline

# Enforces AGENTS.md's bug-fix discipline mechanically:
# any PR that touches backend/routers/, backend/services/, or
# frontend/src/components/ MUST also touch at least one test file,
# OR carry an explicit override label. No exceptions, no silent
# opt-outs.
#
# This is the Layer 2 enforcement — the AGENTS.md rules alone
# cannot survive across sessions of agents that don't auto-load
# the file, so we add a mechanical gate the merge tooling
# actually respects.

on:
  pull_request:
    branches: [main, master]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bug-fix-discipline:
    name: PR must include a test change (or explicit override)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check labels for explicit override
        id: labels
        run: |
          labels='${{ toJson(github.event.pull_request.labels.*.name) }}'
          echo "labels=$labels"
          if echo "$labels" | grep -qE '"(docs-only|no-test-needed)"'; then
            echo "override=true" >> "$GITHUB_OUTPUT"
          else
            echo "override=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Diff-based gate
        if: steps.labels.outputs.override != 'true'
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "Diffing $BASE_SHA..$HEAD_SHA"

          # All files changed in this PR.
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED"
          echo "----"

          # A PR is "fix-shaped" if it touches production code paths.
          FIX_SHAPED=$(echo "$CHANGED" | grep -E \
            '^(backend/(routers|services|models)/|frontend/src/(components|pages|hooks|lib)/)' \
            || true)

          if [ -z "$FIX_SHAPED" ]; then
            echo "OK — PR does not touch production code paths, no test required."
            exit 0
          fi

          echo "PR touches production code paths:"
          echo "$FIX_SHAPED"
          echo "----"

          # It must also touch at least one test file.
          TEST_TOUCHED=$(echo "$CHANGED" | grep -E \
            '(^|/)test_[^/]+\.py$|(^|/)[^/]+\.test\.(js|jsx|ts|tsx)$|(^|/)tests/' \
            || true)

          if [ -n "$TEST_TOUCHED" ]; then
            echo "OK — PR includes test changes:"
            echo "$TEST_TOUCHED"
            exit 0
          fi

          echo "::error::PR touches production code but includes no test change."
          echo ""
          echo "AGENTS.md bug-fix discipline requires either:"
          echo "  1. Add a regression test named test_regression_iter<N>_<desc>"
          echo "     in /app/backend/tests/  (or the appropriate frontend"
          echo "     test dir).  See /app/AGENTS.md for details."
          echo "  2. Or add one of these labels to the PR to override:"
          echo "        [docs-only]  |  [no-test-needed]"
          echo "     Overrides require explicit reviewer sign-off."
          echo ""
          echo "Files that changed production code without an accompanying test:"
          echo "$FIX_SHAPED"
          exit 1

      - name: Override acknowledgement
        if: steps.labels.outputs.override == 'true'
        run: |
          echo "Override label present — skipping test-file requirement."
          echo "Reviewer must sign off on this explicitly."

  invariants:
    name: Fitness-function invariants (always green on main)
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run regression + invariant tests
        working-directory: backend
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME:   aurem_ci_smoke
        run: |
          # Only source-level regression + invariant tests. The DB-
          # backed ones are covered by the main ci.yml job that spins
          # up MongoDB; here we run just the static-guarantee subset
          # so this gate stays under 30 seconds.
          python -m pytest \
            tests/test_regression_iter279_281_bug_per_fix.py::test_regression_iter278_heartbeat_frames_every_6s \
            tests/test_regression_iter279_281_bug_per_fix.py::test_regression_iter280_chat_input_enabled_during_loop \
            tests/test_regression_iter279_281_bug_per_fix.py::test_regression_iter281_plan_approval_reachable_from_any_prior_state \
            tests/test_regression_iter279_281_bug_per_fix.py::test_regression_iter281_loop_live_feed_pending_placeholder \
            tests/test_regression_iter279_281_bug_per_fix.py::test_regression_iter281_intent_tier_indicator_no_null_return \
            tests/test_invariants_continuous_quality.py::test_invariant_chat_input_never_disabled_during_active_loop \
            tests/test_invariants_continuous_quality.py::test_invariant_every_sse_event_reaches_frontend_playwright \
            tests/test_invariants_continuous_quality.py::test_invariant_loop_live_feed_never_returns_null \
            tests/test_invariants_continuous_quality.py::test_invariant_intent_tier_indicator_never_returns_null \
            tests/test_release_it_patterns_iter282.py::test_invariant_bulkhead_unique_index_declared \
            tests/test_release_it_patterns_iter282.py::test_invariant_steady_state_declared_in_bootstrap_spec \
            tests/test_release_it_patterns_iter282.py::test_regression_iter282_sse_stream_has_wallclock_ceiling \
            tests/test_release_it_patterns_iter282.py::test_invariant_governor_retry_ceilings_exist \
            tests/test_sre_discipline_integrity.py \
            tests/test_quality_gate_enforcement.py \
            -v --tb=short

  test-style-guard:
    # Iter 291 — block PRs that add new test files whose STATIC_GREP
    # ratio > 60%. The founder-agreed rule (iter290 real-measurement
    # finding: 50.7% of existing suite is grep-only) is: no NEW test
    # file may compound that debt. Files can opt out via a
    # `# static-grep-ok: <reason>` magic comment (e.g. mutation
    # suites, which are grep-style by design).
    name: Static-grep threshold on new tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run test-style guard on PR diff
        working-directory: backend
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "Diffing $BASE_SHA..$HEAD_SHA for test-style violations"
          python scripts/ci_check_test_style.py "$BASE_SHA" "$HEAD_SHA"


  frontend-vitest:
    # Iter 302 — Frontend QA Charter Layer 1 + Layer 3 C2.
    # Runs the RTL state-sync suite AND the axe-core component-level
    # a11y suite. Baseline discipline: axe assertions only fail on
    # NEW violation ids (see docs/a11y_baseline.json).
    name: Vitest (RTL state-sync + axe component a11y)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend deps
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Vitest full run
        working-directory: frontend
        run: yarn test


  visual-regression:
    # Iter 299 — Frontend QA Charter Layer 2. Pixel-diff the 5
    # canonical unauthenticated routes against committed baselines
    # in frontend/tests/visual/__screenshots__/. See
    # docs/visual_regression.md for the workflow.
    name: Visual regression (Playwright chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend deps
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Install Playwright browsers (chromium only)
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start frontend
        working-directory: frontend
        env:

  lighthouse-ci:
    # Iter 305 — Frontend QA Charter Layer 4. Runs Lighthouse against
    # the PRODUCTION build (`yarn build && yarn preview`) — NEVER the
    # dev server (Vite serves unbundled modules and inflates LCP ~4x).
    # Google's "Good" Core Web Vitals as the hard gate:
    #   LCP ≤ 2500ms · TBT ≤ 200ms · CLS ≤ 0.1
    # See docs/performance_budget.md for the founder-approved rationale.
    name: Lighthouse CI (Core Web Vitals)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend deps
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Build production bundle
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: http://localhost:8001
        run: yarn build
      - name: Run Lighthouse CI (autorun spawns `yarn preview`)
        working-directory: frontend
        run: npx lhci autorun --config=.lighthouserc.json
      - name: Upload Lighthouse report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: frontend/.lighthouseci
          retention-days: 7

          # Point at the built preview so tests hit static assets;
          # we still serve on :3000 like the pod does.
          REACT_APP_BACKEND_URL: http://localhost:8001
        run: |
          yarn start &
          echo "started; waiting for :3000 ..."
          for i in $(seq 1 30); do
            if curl -sSf -o /dev/null http://localhost:3000/; then
              echo "frontend up after ${i}s"; break
            fi
            sleep 1
          done
      - name: Run visual regression
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
        run: npx playwright test
      - name: Upload HTML report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
