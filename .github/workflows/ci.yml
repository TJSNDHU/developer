name: AUREM CI — Build + Test Guard

on:
  push:
    branches: [main, master, dev, staging]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  frontend-build:
    name: Frontend — Build check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Build check
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: https://aurem.live
          CI: "false"
        run: |
          yarn build 2>&1 | tee /tmp/build_output.txt
          if grep -iE "error TS|SyntaxError|Module not found|Failed to compile|Parsing error" /tmp/build_output.txt; then
            echo "❌ BUILD FAILED — broken code detected"
            exit 1
          fi
          echo "✅ Build passed"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-log
          path: /tmp/build_output.txt
          retention-days: 7


  backend-tests:
    name: Backend — pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: aurem_test
      JWT_SECRET: ci-test-secret-32-chars-minimum!!
      OPENROUTER_API_KEY: sk-test-not-real
      EMERGENT_LLM_KEY: test-not-real
      AUREM_CTO_MASTER_KEY: ci-test-master-key-32-chars-long!!
      REDIS_URL: ""
      DISABLE_UPSTREAM_TOOLS: "1"
      ENABLE_EVAL_CRON: "0"
      APP_URL: http://localhost:8001
      PYTHONDONTWRITEBYTECODE: "1"
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --no-cache-dir -r requirements.txt \
            pytest pytest-asyncio pytest-cov pytest-timeout httpx --quiet

      - name: Run tests
        working-directory: backend
        run: |
          python -m pytest \
            --tb=short \
            --timeout=30 \
            -q \
            --cov=. \
            --cov-report=term-missing \
            -x \
            2>&1 | tee /tmp/pytest_output.txt
          echo "Exit: ${PIPESTATUS[0]}"
          exit ${PIPESTATUS[0]}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: /tmp/pytest_output.txt
          retention-days: 7


  security-scan:
    name: Security — Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python vulnerability scan
        working-directory: backend
        continue-on-error: true
        run: |
          pip install pip-audit --quiet
          pip-audit -r requirements.txt --format json 2>/dev/null | \
          python3 -c "
          import json,sys
          try:
            data=json.load(sys.stdin)
            vulns=[v for d in data.get('dependencies',[])
                   for v in d.get('vulns',[])
                   if v.get('fix_versions')]
            if vulns:
              print(f'⚠ {len(vulns)} fixable vulnerabilities')
            else:
              print('✅ No fixable vulnerabilities')
          except: print('scan complete')
          " || echo "pip-audit done"

      - name: Node vulnerability scan
        working-directory: frontend
        continue-on-error: true
        run: |
          yarn audit --level high 2>&1 | tail -10 || echo "yarn audit done"


  deploy-gate:
    name: Deploy gate — all checks passed
    needs: [frontend-build, backend-tests, security-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        run: |
          echo "✅ Frontend build: passed"
          echo "✅ Backend tests: passed"
          echo "✅ Security scan: passed"
          echo "🚀 Safe to deploy to aurem.live"

      - name: Notify AUREM dashboard
        if: ${{ secrets.AUREM_API_KEY != '' }}
        env:
          API_KEY: ${{ secrets.AUREM_API_KEY }}
        run: |
          curl -s -X POST \
            "https://auremcto.com/api/aurem-dev/github-deploy/report" \
            -H "Content-Type: application/json" \
            -d "{\"api_key\":\"$API_KEY\",\"commit\":\"${{ github.sha }}\",\"status\":\"ci_passed\",\"repo\":\"${{ github.repository }}\"}" \
            || echo "notify done"
