name: AUREM CI — Test Suite
# ─────────────────────────────────────────────────────────────────────
# Iter 139 — runs on every push / PR. Backend pytest + frontend
# build-check + Mongo-7 service. Deploy workflow (auto_deploy.yml)
# is gated on this passing.
# ─────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, master, dev, staging]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend — pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: auremdev_test
      JWT_SECRET: ci-test-secret-not-real
      OPENROUTER_API_KEY: sk-test-not-real
      EMERGENT_LLM_KEY: test-not-real
      AUREM_CTO_MASTER_KEY: ci-test-master-key-32-chars-long!!
      DISABLE_UPSTREAM_TOOLS: "1"
      ENABLE_EVAL_CRON: "0"
      APP_URL: http://localhost:8001
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install --no-cache-dir -r requirements.txt \
            --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/
          pip install --no-cache-dir pytest pytest-asyncio pytest-timeout httpx

      - name: Run pytest with coverage
        working-directory: backend
        run: |
          set -o pipefail
          pip install --quiet pytest-cov
          python -m pytest tests/ \
            --tb=short \
            --timeout=60 \
            -q \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=json:/tmp/coverage.json \
            --ignore=tests/test_iter44_vanguard.py \
            2>&1 | tee /tmp/pytest_output.txt
          # Iter 140 — surface coverage as a summary line. Soft gate at
          # 40% (warn only) to avoid blocking a green test run while we
          # build coverage up gradually.
          python3 -c "
          import json
          with open('/tmp/coverage.json') as f:
              data = json.load(f)
          total = data['totals']['percent_covered']
          print(f'Coverage: {total:.1f}%')
          if total < 40:
              print('::warning::Coverage below 40% — consider adding tests')
          else:
              print('Coverage acceptable')
          " || true

      - name: Security audit — pip-audit
        working-directory: backend
        continue-on-error: true
        run: |
          pip install --quiet pip-audit
          pip-audit --requirement requirements.txt \
            --ignore-vuln GHSA-r9dh-gcmq-hh33 \
            --output json 2>/dev/null | \
            python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
          except Exception:
              print('pip-audit: no JSON output (likely zero vulnerabilities)')
              sys.exit(0)
          vulns = [v for d in data.get('dependencies', [])
                   for v in d.get('vulns', [])
                   if v.get('fix_versions')]
          if vulns:
              print(f'::warning::pip-audit: {len(vulns)} fixable vulnerabilities found')
              for v in vulns[:5]:
                  print(f'  {v[\"id\"]}: {v.get(\"description\",\"\")[:80]}')
          else:
              print('pip-audit: no fixable vulnerabilities')
          " || echo "pip-audit check complete"

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: /tmp/pytest_output.txt
          retention-days: 7

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: /tmp/coverage.json
          retention-days: 30

  frontend-lint:
    name: Frontend — build check
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Build check (Vite)
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: https://auremcto.com
          VITE_API_URL: https://auremcto.com
        run: yarn build 2>&1 | tail -40

      - name: Security audit — yarn audit
        working-directory: frontend
        continue-on-error: true
        run: |
          # Iter 140 — high-severity threshold to avoid noise from
          # dev-only transitive deps. Non-zero exit = informational
          # warning only (continue-on-error).
          yarn audit --groups dependencies --level high 2>&1 | tail -20 \
            || echo "yarn audit completed (non-zero exit is informational)"

  notify-on-failure:
    name: Notify on failure
    needs: [backend-tests, frontend-lint]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Post failure status to AUREM
        if: ${{ secrets.AUREM_API_KEY != '' }}
        env:
          API_KEY: ${{ secrets.AUREM_API_KEY }}
        run: |
          curl -s -X POST \
            "https://auremcto.com/api/aurem-dev/github-deploy/report" \
            -H "Content-Type: application/json" \
            -d "{\"api_key\":\"$API_KEY\",\"commit\":\"${{ github.sha }}\",\"status\":\"ci_failed\",\"repo\":\"${{ github.repository }}\"}" \
            || echo "Notify failed (non-fatal)"
