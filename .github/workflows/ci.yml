name: AUREM CI — Build + Test Guard

on:
  # Iter 309 · Phase 0.2 — CI trigger reality check (round 2).
  # Round 1 (iter 306) fixed quality-gate.yml's on: to include
  # `push: branches: **`. This workflow (ci.yml) was NOT updated at
  # the same time — it kept `push: branches: [main, master, dev,
  # staging]` which meant no feature branch push (e.g. Emergent's
  # Save-to-GitHub picking any custom branch) ever triggered the
  # backend pytest job. Founder pushed `phase-0.2-canary` to prove
  # CI failure propagation; ci.yml never fired because the branch
  # name didn't match the whitelist. Symmetry with quality-gate.yml
  # restored below.
  push:
    branches:
      - '**'
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  frontend-build:
    name: Frontend — Build check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile --prefer-offline

      - name: Build check
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: https://aurem.live
          CI: "false"
        run: |
          yarn build 2>&1 | tee /tmp/build_output.txt
          if grep -iE "error TS|SyntaxError|Module not found|Failed to compile|Parsing error" /tmp/build_output.txt; then
            echo "❌ BUILD FAILED — broken code detected"
            exit 1
          fi
          echo "✅ Build passed"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-log
          path: /tmp/build_output.txt
          retention-days: 7


  backend-tests:
    name: Backend — pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: aurem_test
      JWT_SECRET: ci-test-secret-32-chars-minimum!!
      OPENROUTER_API_KEY: sk-test-not-real
      EMERGENT_LLM_KEY: test-not-real
      AUREM_CTO_MASTER_KEY: ci-test-master-key-32-chars-long!!
      REDIS_URL: ""
      DISABLE_UPSTREAM_TOOLS: "1"
      ENABLE_EVAL_CRON: "0"
      APP_URL: http://localhost:8001
      PYTHONDONTWRITEBYTECODE: "1"
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          # Iter 306 — emergentintegrations lives on Emergent's private
          # index (not on public PyPI), so GH-hosted runners need the
          # --extra-index-url to resolve it.
          pip install --no-cache-dir -r requirements.txt \
            --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/ \
            pytest pytest-asyncio pytest-cov pytest-timeout httpx --quiet

      - name: Run tests
        working-directory: backend
        run: |
          # Iter 309 · Phase 0.2 · Round 6 — CAPTURE pytest exit code
          # IMMEDIATELY. Round 5 added a grep-based canary-proof block
          # AFTER the pytest pipe and BEFORE `exit ${PIPESTATUS[0]}`,
          # which clobbered PIPESTATUS to point at the grep (always 0
          # when the canary line is present) instead of pytest.
          # Result: every failing pytest run showed the step as GREEN
          # because $? by the time exit ran was zero. Classic
          # bash-pipe exit-code trap. `set -o pipefail` also enabled
          # as belt-and-braces so the `2>&1 | tee` pipe returns the
          # left-hand exit code by default.
          set -o pipefail
          python -m pytest \
            --tb=short \
            --timeout=30 \
            -q \
            --cov=. \
            --cov-report=term-missing \
            --continue-on-collection-errors \
            --ignore=tests/test_iter138_acceptance_seven.py \
            --ignore=tests/test_iter212m163_aggression_chat.py \
            2>&1 | tee /tmp/pytest_output.txt
          PYTEST_EXIT=${PIPESTATUS[0]}
          echo "Pytest exit code (captured immediately): $PYTEST_EXIT"

          # Exit with pytest's exit code (captured before any post-processing).
          exit "$PYTEST_EXIT"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: /tmp/pytest_output.txt
          retention-days: 7


  simulated-user-qa:
    # Directive Session — Promptfoo simulated-user QA (self-hosted).
    # Runs 15 real-persona scenarios against the live backend +
    # orchestrator chain. Gates deploy_gate same as ruff/eslint verify.
    name: Simulated-user QA (promptfoo)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-tests]

    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Directive-mandated self-hosted flags — no Promptfoo Cloud call.
      PROMPTFOO_DISABLE_REMOTE_GENERATION: "true"
      PROMPTFOO_DISABLE_SHARE:              "true"
      PROMPTFOO_DISABLE_TELEMETRY:          "true"
      # Enable QA probe on the CI backend.
      AUREM_QA_MODE:  "true"
      AUREM_QA_TOKEN: "qa-ci-probe-token-must-be-32-chars-min!"
      MONGO_URL:            mongodb://localhost:27017
      DB_NAME:              aurem_qa_ci
      JWT_SECRET:           ci-test-secret-32-chars-minimum!!
      OPENROUTER_API_KEY:   ${{ secrets.OPENROUTER_API_KEY }}
      EMERGENT_LLM_KEY:     ${{ secrets.EMERGENT_LLM_KEY }}
      AUREM_CTO_MASTER_KEY: ci-test-master-key-32-chars-long!!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: qa/simulated-user/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: |
          # Iter 306 — emergentintegrations is on Emergent's private
          # index (not public PyPI); include --extra-index-url so the
          # GH runner can resolve it.
          pip install -r requirements.txt \
            --extra-index-url https://d33sy5i8bnduwe.cloudfront.net/simple/

      - name: Boot backend in background
        working-directory: backend
        run: |
          uvicorn main:app --host 0.0.0.0 --port 8001 &
          echo $! > /tmp/backend.pid
          for i in {1..60}; do
            curl -sf http://127.0.0.1:8001/health && break
            sleep 1
          done

      - name: Install promptfoo (dev-only)
        working-directory: qa/simulated-user
        run: npm ci --no-audit --no-fund

      - name: Run simulated-user QA suite
        working-directory: qa/simulated-user
        env:
          CI: "true"
        run: bash run.sh

      - name: Stop backend
        if: always()
        run: |
          if [[ -f /tmp/backend.pid ]]; then kill "$(cat /tmp/backend.pid)" || true; fi

      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulated-user-qa-report
          path: /tmp/aurem_qa_report.json
          retention-days: 14



  security-scan:
    name: Security — Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python vulnerability scan
        working-directory: backend
        continue-on-error: true
        run: |
          pip install pip-audit --quiet
          pip-audit -r requirements.txt --format json 2>/dev/null | \
          python3 -c "
          import json,sys
          try:
            data=json.load(sys.stdin)
            vulns=[v for d in data.get('dependencies',[])
                   for v in d.get('vulns',[])
                   if v.get('fix_versions')]
            if vulns:
              print(f'⚠ {len(vulns)} fixable vulnerabilities')
            else:
              print('✅ No fixable vulnerabilities')
          except: print('scan complete')
          " || echo "pip-audit done"

      - name: Node vulnerability scan
        working-directory: frontend
        continue-on-error: true
        run: |
          yarn audit --level high 2>&1 | tail -10 || echo "yarn audit done"


  secret-scan:
    # Iter 212m-120 — Phase 1 of the Vanguard scanner sidecar plan.
    # Runs trufflehog over the full checkout, posts the JSON output
    # to the AUREM backend (/api/aurem-dev/vanguard/ci-findings) so
    # the dashboard can render it next to in-process Vanguard
    # findings, and FAILS the CI run only when at least one VERIFIED
    # secret is detected.  Pattern-only hits warn but don't block —
    # otherwise every fixture/test secret would red-light every PR.
    name: Security — Secret scan (trufflehog)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Iter 306 — hoist secret to job-level env so the step below can
      # gate itself via `env.CI_TOKEN != ''` (secrets context is
      # disallowed inside step-level `if:`).
      CI_TOKEN: ${{ secrets.AUREM_CI_INGEST_TOKEN }}
    steps:
      - name: Checkout (full history for diff scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install trufflehog
        run: |
          # Pinned to a stable v3.x — official install script always
          # pulls the latest release and verifies the checksum.
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b /usr/local/bin
          trufflehog --version

      - name: Run trufflehog filesystem scan
        id: scan
        run: |
          set +e
          # JSON-lines output → parse later in python.
          trufflehog filesystem . \
            --json \
            --no-update \
            --exclude-paths=.trufflehog-exclude \
            > /tmp/trufflehog.jsonl 2>/tmp/trufflehog.err
          EXIT=$?
          # Exit 183 = findings present (trufflehog convention); 0 =
          # clean; anything else = real failure.
          echo "exit_code=$EXIT" >> $GITHUB_OUTPUT
          if [ "$EXIT" != "0" ] && [ "$EXIT" != "183" ]; then
            echo "::warning::trufflehog failed with exit=$EXIT — see stderr"
            cat /tmp/trufflehog.err || true
          fi
          # Always count + classify so the downstream gate has data
          # to act on even if the binary errored mid-run.
          python3 <<'PY'
          import json, os, sys
          rows = []
          try:
              with open("/tmp/trufflehog.jsonl") as fh:
                  for line in fh:
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          rows.append(json.loads(line))
                      except Exception:
                          pass
          except FileNotFoundError:
              pass
          verified   = sum(1 for r in rows if r.get("Verified"))
          unverified = len(rows) - verified
          print(f"Trufflehog scan: total={len(rows)} verified={verified} unverified={unverified}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"total={len(rows)}\n")
              fh.write(f"verified={verified}\n")
              fh.write(f"unverified={unverified}\n")
          # Emit a compact JSON for the next step to POST.
          with open("/tmp/trufflehog.compact.json", "w") as fh:
              json.dump(rows[:2000], fh)
          PY

      - name: Upload trufflehog raw output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-jsonl
          path: |
            /tmp/trufflehog.jsonl
            /tmp/trufflehog.err
          retention-days: 7

      - name: Post findings to AUREM dashboard
        if: env.CI_TOKEN != ''
        env:
          API_URL:    ${{ vars.AUREM_API_URL }}
        run: |
          export BASE_URL="${API_URL:-https://auremcto.com}"
          python3 <<'PY'
          import json, os, urllib.request
          with open("/tmp/trufflehog.compact.json") as fh:
              findings = json.load(fh)
          body = {
              "repo":         os.environ["GITHUB_REPOSITORY"],
              "commit":       os.environ["GITHUB_SHA"],
              "branch":       os.environ.get("GITHUB_REF_NAME", ""),
              "scanner":      "trufflehog",
              "findings":     findings,
              "run_url":      f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "triggered_by": os.environ.get("GITHUB_ACTOR", ""),
          }
          url = f"{os.environ['BASE_URL']}/api/aurem-dev/vanguard/ci-findings"
          req = urllib.request.Request(
              url,
              data=json.dumps(body).encode(),
              method="POST",
              headers={
                  "Content-Type":  "application/json",
                  "Authorization": f"Bearer {os.environ['CI_TOKEN']}",
              },
          )
          try:
              resp = urllib.request.urlopen(req, timeout=15)
              print("Ingest OK:", resp.status, resp.read().decode()[:200])
          except Exception as e:
              # Soft-fail the report — never block the deploy gate on
              # a backend hiccup. The verified-secret gate below is
              # the real safety check.
              print(f"::warning::AUREM ingest failed: {e!r}")
          PY

      - name: Fail on verified secrets
        if: steps.scan.outputs.verified != '0'
        run: |
          echo "::error::Trufflehog found ${{ steps.scan.outputs.verified }} VERIFIED secrets — blocking merge."
          echo "Download the 'trufflehog-jsonl' artifact for details, or visit the AUREM dashboard."
          exit 1


  deploy-gate:
    name: Deploy gate — all checks passed
    needs: [frontend-build, backend-tests, simulated-user-qa, security-scan, secret-scan]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    env:
      # Iter 306 — hoist secret to job-level env so the step below can
      # gate on `env.API_KEY != ''` (secrets context is disallowed
      # inside step-level `if:`).
      API_KEY: ${{ secrets.AUREM_API_KEY }}
    steps:
      - name: All checks passed
        run: |
          echo "✅ Frontend build: passed"
          echo "✅ Backend tests: passed"
          echo "✅ Simulated-user QA: passed"
          echo "✅ Security scan: passed"
          echo "✅ Secret scan:   passed"
          echo "🚀 Safe to deploy to aurem.live"

      - name: Notify AUREM dashboard
        if: env.API_KEY != ''
        run: |
          curl -s -X POST \
            "https://auremcto.com/api/aurem-dev/github-deploy/report" \
            -H "Content-Type: application/json" \
            -d "{\"api_key\":\"$API_KEY\",\"commit\":\"${{ github.sha }}\",\"status\":\"success\",\"repo\":\"${{ github.repository }}\"}" \
            || echo "notify done"
